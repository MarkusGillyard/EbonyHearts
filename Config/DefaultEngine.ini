[SystemSettings]
; The Vulkan RHI's simple CPU frame pacer assumes a 60 Hz display on Linux (the generic platform
; reports 60 as the maximum refresh), which held VSync'd frames to 60 on faster displays. VSync and
; the game's own cap (which follows the display) pace frames instead.
r.Vulkan.CPURHIThreadFramePacer=0
; TSR keeps its history at the output resolution (the Epic level doubles it, which cost 3.5 ms a
; frame at 3440 x 1440 on an RTX 2060).
r.TSR.History.ScreenPercentage=100
; Slate's font cache flushes (invalidating every widget and reloading the font faces) whenever its
; one atlas page or one large-glyph texture fills, and grows only if two fills land in the same
; frame. The HUD's popping combo count and the big announcements draw at many sizes, so a match
; flushed it a dozen times, sometimes five frames apart: keep a few pages and grow instead.
Slate.MaxFontAtlasPagesBeforeFlush=8
Slate.MaxFontNonAtlasTexturesBeforeFlush=8
Slate.GrowFontAtlasFrameWindow=300
Slate.GrowFontNonAtlasFrameWindow=300
